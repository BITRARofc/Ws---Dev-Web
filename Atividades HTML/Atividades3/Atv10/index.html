<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 10</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <form action="./" method="post">
            <h2>Informações Pessoais</h2>
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome" placeholder="Nome Completo" autofocus required><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="email@mail.com" required><br>
            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" placeholder="Senha" minlength="8" required><br>
            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" name="nascimento" id="nascimento" required><br>
            <label for="genero">Gênero:</label>
            <select name="genero" id="genero">
                <option value="default">Selecione...</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
            </select><br>
            <input type="checkbox" name="termos" id="termos" required> 
            <label for="termos">Aceito os <a href="#">Termos de Uso</a> </label><br>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>   
        </form>
    </div>
</body>
</html>
