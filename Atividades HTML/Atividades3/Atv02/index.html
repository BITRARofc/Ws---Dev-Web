<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <label for="numero">Insira um número</label><br>
        <input type="number" name="numero" id="numero" min="0" max="30" placeholder="Número" required><br><br>
        <label for="senha">Insira sua senha</label><br>
        <input type="password" name="senha" id="senha" maxlength="16" placeholder="Digite sua senha" required>
    </div>
    <div>
        <br>
        <input type="button" value="Enviar">
        <input type="reset" value="Limpar">
    </div>
</body>
</html>
