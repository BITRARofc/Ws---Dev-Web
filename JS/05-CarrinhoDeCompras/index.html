<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compra</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="titulo">
            <h1>Carrinhos de Compras</h1>
            <h2>Itens de Tecnologia</h2>
        </div>

        <button class="btn-header" onclick="abrirModal()"><span>+</span>Novo Produto</button>  
    </header>
    <main>
        <section class="card">
            <h2>Adicionar Produto</h2>
            <label for="Produto">Produto</label>
            <select name="produto" id="produto">
            </select>
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" min="1" value="1">
            
            <button onclick="adicionarProduto()" class="btn-default adicionar">Adicionar ao Carrinho</button>
            <div class="preview" id="preview"></div>

        </section>
        <section class="card">
            <h2>Produtos no Carrinho</h2>
            <div class="carrinho" id="carrinho"></div>
            <hr/>
            <div class="summary">
                <div class="summary-total">
                  <p>Total</p>
                  <p class="total-valor" id="total-valor">R$ 0,00</p>
                </div>
                <button class="btn-default" onclick="limparCarrinho()">Limpar</button>
            </div>
        </section>
    </main>

    <dialog id="modalProduto">
        <h2>Novo produto</h2>
         
          <label for="novoNome">Nome</label>
        <input type="text" id="novoNome" placeholder="Ex: Teclado Mecânico" />
         
          <label for="novoPreco">Preço</label>
        <input type="number" id="novoPreco" placeholder="Ex: 199.90" />
         
          <label for="novaDescricao">Descrição</label>
        <input type="text" id="novaDescricao" placeholder="Ex: RGB, USB, ABNT2" />
         
          <label for="novaImagem">URL da imagem</label>
        <input type="text" id="novaImagem" placeholder="https://exemplo.com/imagem.jpg" />
         
          <div class="modal-actions">
        <button class="btn-light" onclick="fecharModal()">Cancelar</button>
        <button onclick="salvarProduto()">Salvar</button>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
