<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compra</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="titulo">
            <h1>Carrinhos de Compras</h1>
            <h2>Itens de Tecnologia</h2>
        </div>

        <button class="btn-header"><span>+</span>Novo Produto</button>  
    </header>
    <main>
        <section class="card">
            <h2>Adicionar Produto</h2>
            <label for="Produto">Produto</label>
            <select name="produto" id="produto">
            </select>
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" min="1" value="1">
            
            <button class="btn-default">Adicionar ao Carrinho</button>

            <div class="info">
                <div class="info-imagem" style="width: 150px;">
                    <img src="https://placehold.co/150x150" alt="">
                </div>
                    <div class="info-dados">
                        <h3>Mouse</h3>
                        <p>Mouse optico</p>
                        <p>R$159.99</p>
                    </div>
                </div>
        </section>
        <section class="card">
            <h2>Produtos no Carrinho</h2>
            <p>Seu carrinho está vazio</p>
            <hr/>
            <div class="summary">
                <div class="total-valor">
                    <p>Total</p>
                    <p class="valor">R$0.00</p> 
                </div>
                <button class="btn-default">Limpar</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
